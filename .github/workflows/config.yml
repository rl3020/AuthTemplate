name: Deploy Supabase Config

on:
  push:
    branches:
      - main
    paths:
      - "supabase/config.toml"
      - "supabase/templates/**"
  # Lets you manually re-run this against the current main branch from the
  # Actions tab (Run workflow button) without needing a new commit — handy
  # for testing after setting the SMTP_CONFIGURED repo variable or fixing
  # a secret.
  workflow_dispatch:

jobs:
  config:
    runs-on: ubuntu-latest
    # Reads an optional repo variable (Settings → Secrets and variables →
    # Actions → Variables tab), falling back to "false" if it's unset —
    # which it always is on a fresh fork, since repo variables aren't
    # copied by GitHub's "Use this template". Set it to "true" there once
    # SMTP is set up under Authentication → Emails → SMTP Settings (see
    # README Prerequisites) — deliberately NOT a literal committed value
    # here, so this repo (which is both the template source and its own
    # live deployment) can safely have its own variable set to "true"
    # without that leaking into what new forks start with.
    env:
      SMTP_CONFIGURED: ${{ vars.SMTP_CONFIGURED || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Free-tier Supabase projects reject custom email template pushes
      # outright (see README Prerequisites) unless SMTP is configured, so
      # this step is opt-in via the SMTP_CONFIGURED flag above rather than
      # always attempted-and-caught: catching Supabase's error text by
      # string match would silently break the moment they reword it, and
      # would just as silently swallow a *real* config error too. Until the
      # repo variable is set, this step is skipped, and forgot/reset
      # password just isn't wired up yet.
      - name: Push config (auth settings, email templates) to production
        if: env.SMTP_CONFIGURED == 'true'
        run: supabase config push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Skip email template push (SMTP not configured)
        if: env.SMTP_CONFIGURED != 'true'
        run: echo "::warning::Skipping email template push — the SMTP_CONFIGURED repo variable isn't set to 'true' (Settings → Secrets and variables → Actions → Variables tab). Forgot/reset password won't work until it is. See README Prerequisites."
