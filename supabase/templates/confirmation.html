<!--
  A <style> block won't render in Outlook desktop (it uses Word's rendering
  engine, which strips <style> tags) — for a dev-tool template that's a
  reasonable tradeoff for far more readable markup than fully inline styles.
  If you need Outlook-desktop support, inline these instead.
-->
<style>
  body { margin: 0; background-color: #f5f5f5; }
  .wrapper { padding: 40px 16px; }
  .card {
    max-width: 480px;
    margin: 0 auto;
    background-color: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .content { padding: 40px; text-align: center; }
  .title { margin: 0 0 12px; font-size: 20px; font-weight: 600; color: #171717; }
  .body-text { margin: 0; font-size: 15px; line-height: 1.6; color: #666666; }
  .button {
    display: inline-block;
    margin-top: 28px;
    padding: 12px 28px;
    background-color: #171717;
    color: #ffffff;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    border-radius: 8px;
  }
  .footer {
    margin: 24px 0 0;
    padding-top: 24px;
    border-top: 1px solid #f0f0f0;
    font-size: 13px;
    color: #999999;
  }
</style>

<div class="wrapper">
  <div class="card">
    <div class="content">
      <h1 class="title">Confirm your email</h1>
      <p class="body-text">
        Follow the link below to confirm your email address and finish
        setting up your account.
      </p>
      <a
        class="button"
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/dashboard"
      >
        Confirm email
      </a>
      <p class="footer">
        If you didn't create an account, you can safely ignore this email.
      </p>
    </div>
  </div>
</div>
